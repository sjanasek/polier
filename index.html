<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Polier – Bauabrechnung</title>
    <meta name="description" content="Leistungsverzeichnis, Kalkulation, Aufmaß, Bauzeitenplan, Rechnungen und Nachkalkulation für den Bau." />
    <!-- Web-App (PWA): Manifest, Symbole, Farben für Browserleiste und iOS-Startbildschirm -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#3f8f38" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111a10" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Polier" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <script>
      (function () {
        try {
          var m = localStorage.getItem('polier-theme') || 'hell';
          var d = m === 'dunkel' || (m === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.setAttribute('data-theme', d ? 'dark' : 'light');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
